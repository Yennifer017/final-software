<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${asunto}">RutaGT</title>
</head>
<!-- Colores de la guía de estilo (mockups): azul noche #0B2545, primario #1D5BA6, acento #E8971E -->
<body style="margin:0;padding:0;background:#F7F7F5;font-family:'Fira Sans',Arial,sans-serif;color:#1E2329;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F7F5;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0"
           style="max-width:600px;width:100%;background:#FFFFFF;border:1px solid #E3E5E8;border-radius:14px;overflow:hidden;">
      <tr>
        <td style="background:#0B2545;padding:20px 28px;color:#FFFFFF;font-size:20px;font-weight:700;">
          <span style="display:inline-block;background:#E8971E;color:#081A33;border-radius:8px;padding:4px 10px;margin-right:8px;">&#128652;</span>
          RutaGT
        </td>
      </tr>
      <tr>
        <td style="padding:28px;">
          <h1 style="margin:0 0 12px;font-size:22px;color:#0B2545;" th:text="${titulo}">Título</h1>
          <p style="margin:0 0 12px;font-size:16px;" th:text="${saludo}">Hola</p>
          <p th:each="p : ${parrafos}" style="margin:0 0 12px;font-size:16px;line-height:1.5;" th:text="${p}">Texto</p>
          <table th:if="${!#maps.isEmpty(detalles)}" role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="margin:16px 0;border:1px solid #E3E5E8;border-radius:10px;border-collapse:separate;">
            <tr th:each="d : ${detalles}">
              <td style="padding:10px 14px;background:#EEF4FB;font-size:14px;color:#545D69;width:40%;border-bottom:1px solid #E3E5E8;"
                  th:text="${d.key}">Campo</td>
              <td style="padding:10px 14px;font-size:14px;font-weight:600;border-bottom:1px solid #E3E5E8;"
                  th:text="${d.value}">Valor</td>
            </tr>
          </table>
          <p th:if="${accionUrl != null}" style="margin:20px 0;">
            <a th:href="${accionUrl}" th:text="${accionTexto}"
               style="display:inline-block;background:#1D5BA6;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;">Abrir</a>
          </p>
          <p th:if="${nota != null}" style="margin:16px 0 0;padding:12px 14px;background:#FDF0DA;border-radius:10px;font-size:14px;color:#8A4B00;"
             th:text="${nota}">Nota</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 28px;background:#F0F1F3;font-size:12px;color:#545D69;">
          Este es un mensaje automático de RutaGT · Transporte extraurbano de Guatemala. No respondas a este correo.
        </td>
      </tr>
    </table>
  </td></tr>
</table>
</body>
</html>
