server:
  port: 8083
  shutdown: graceful
spring:
  application:
    name: ms-viajes
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_viajes
    username: ${DB_USER:rutagt}
    password: ${DB_PASSWORD:rutagt}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Guatemala
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rutagt}
    password: ${RABBITMQ_PASSWORD:rutagt}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 8000
  jackson:
    time-zone: America/Guatemala
    default-property-inclusion: always
  web:
    locale: es
    locale-resolver: fixed
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
rutagt:
  jwt:
    secret: ${JWT_SECRET}
  security:
    public-paths: /api/viajes/publicos/**
  openapi:
    descripcion: Viajes, salidas/llegadas y venta de boletos
spring.cloud.openfeign.client.config.default:
  connect-timeout: 2000
  read-timeout: 3000
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        ignore-exceptions:
          - gt.rutagt.common.errors.ApiException
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        ignore-exceptions:
          - gt.rutagt.common.errors.ApiException
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
